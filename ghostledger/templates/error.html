{% extends "base.html" %}

{% block title %}Error {{ code }} - GhostLedger AI{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--danger);">Error {{ code }}</h1>
        <p style="font-size: 1rem; color: var(--neutral-700); margin-bottom: 2rem;">{{ message }}</p>
        <div>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                Return to Executive Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
